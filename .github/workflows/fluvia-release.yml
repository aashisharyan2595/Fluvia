name: Fluvia Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to create, such as v0.1.0-debug
        type: string
        required: true

concurrency:
  group: fluvia-release-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  build:
    name: Android
    uses: ./.github/workflows/reusable-android-build.yml
    permissions:
      contents: read
    with:
      variant: debug
      run-verification: false
      upload-artifact: true
      artifact-name: fluvia-apk
    secrets:
      GRADLE_ENCRYPTION_KEY: ${{ secrets.GRADLE_ENCRYPTION_KEY }}
      LASTFM_API_KEY: ${{ secrets.LASTFM_API_KEY }}
      LASTFM_SECRET: ${{ secrets.LASTFM_SECRET }}
      LYPRIO_BASE_URL: ${{ secrets.LYPRIO_BASE_URL }}
      LYPRIO_HMAC_KEY: ${{ secrets.LYPRIO_HMAC_KEY }}

  publish:
    name: Publish release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download APK
        uses: actions/download-artifact@v4
        with:
          name: fluvia-apk
          path: apk

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          apk="$(find apk -name '*.apk' | head -n 1)"
          test -n "$apk"
          cp "$apk" "Fluvia-${TAG}.apk"
          gh release create "$TAG" "Fluvia-${TAG}.apk" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "Fluvia ${TAG}" \
            --prerelease \
            --notes "Debug-signed build for sideloading. Not tested on a device yet."
